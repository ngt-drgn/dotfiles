[main]
# Set font family and base size
font=JetBrainsMono Nerd Font:size=10

# dpi-aware accepts boolean values ('yes' or 'no')
dpi-aware=no

# Uniform padding: horizontal x vertical (in pixels)
pad=10x10

[colors-dark]
# Catppuccin Mocha
foreground=cdd6f4
background=1e1e2e

# Normal (regular) colors
regular0=45475a # surface1
regular1=f38ba8 # red
regular2=a6e3a1 # green
regular3=f9e2af # yellow
regular4=89b4fa # blue
regular5=f5c2e7 # pink
regular6=94e2d5 # teal
regular7=bac2de # subtext1

# Bright colors
bright0=585b70  # surface2
bright1=f38ba8  # red
bright2=a6e3a1  # green
bright3=f9e2af  # yellow
bright4=89b4fa  # blue
bright5=f5c2e7  # pink
bright6=94e2d5  # teal
bright7=a6adc8  # subtext0

# Selection colors
selection-foreground=cdd6f4
selection-background=313244
